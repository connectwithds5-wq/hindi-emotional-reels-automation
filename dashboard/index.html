<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dil Ki Diary — Live Analytics</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f1eb;color:#211d1a}header{padding:28px 6%;background:#211d1a;color:#fff}header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#d8cec5}.wrap{max-width:1200px;margin:auto;padding:28px 6%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid #e7dfd7;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0000000a}.label{font-size:13px;color:#777}.value{font-size:30px;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee;font-size:14px}.table th{color:#777}.status{margin:18px 0;padding:12px 15px;border-radius:10px;background:#f1ebe5}.empty{text-align:center;padding:45px 10px;color:#777}.live{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#39a85b;display:inline-block}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.value{font-size:24px}.table th,.table td{font-size:12px}}</style></head><body><header><h1>♡ Dil Ki Diary</h1><p>YouTube Shorts — Live Analytics</p></header><main class="wrap"><div id="status" class="status"><span class="live"><span class="dot"></span> Connecting to live data…</span></div><section class="cards"><div class="card"><div class="label">Total Shorts</div><div id="videos" class="value">—</div></div><div class="card"><div class="label">Total Views</div><div id="views" class="value">—</div></div><div class="card"><div class="label">Total Likes</div><div id="likes" class="value">—</div></div><div class="card"><div class="label">Total Comments</div><div id="comments" class="value">—</div></div></section><div class="grid"><section class="panel"><h2>Views over time</h2><canvas id="chart"></canvas></section><section class="panel"><h2>Engagement</h2><canvas id="engagement"></canvas></section></div><section class="panel" style="margin-top:18px"><h2>Top performing Shorts</h2><div id="table" class="empty">Loading…</div></section></main><script>const DATA_URL='https://raw.githubusercontent.com/connectwithds5-wq/hindi-emotional-reels-automation/main/data/analytics_history.json';const fmt=n=>Number(n||0).toLocaleString('en-IN');let chart,engagement;function escapeHtml(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch(DATA_URL+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(!Array.isArray(rows)||!rows.length){status.innerHTML='<span class="live"><span class="dot"></span> No analytics data yet — run the YouTube Analytics workflow first.</span>';table.innerHTML='<div class="empty">No analytics collected yet.</div>';return}const latest=new Map();rows.forEach(x=>{if(x.video_id)latest.set(x.video_id,x)});const data=[...latest.values()];const views=data.reduce((s,x)=>s+Number(x.views||0),0),likes=data.reduce((s,x)=>s+Number(x.likes||0),0),comments=data.reduce((s,x)=>s+Number(x.comments||0),0);videos.textContent=fmt(data.length);document.getElementById('views').textContent=fmt(views);document.getElementById('likes').textContent=fmt(likes);document.getElementById('comments').textContent=fmt(comments);const times=rows.map(x=>new Date(x.collected_at).getTime()).filter(Number.isFinite);status.innerHTML='<span class="live"><span class="dot"></span> Live · Last sync: '+(times.length?new Date(Math.max(...times)).toLocaleString('en-IN'):'—')+'</span>';data.sort((a,b)=>Number(b.views||0)-Number(a.views||0));table.innerHTML='<table class="table"><thead><tr><th>Short</th><th>Views</th><th>Likes</th><th>Comments</th></tr></thead><tbody>'+data.slice(0,10).map(x=>'<tr><td>'+escapeHtml(x.title)+'</td><td>'+fmt(x.views)+'</td><td>'+fmt(x.likes)+'</td><td>'+fmt(x.comments)+'</td></tr>').join('')+'</tbody></table>';const ordered=data.slice().reverse();const labels=ordered.map(x=>x.published_at?new Date(x.published_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'');if(chart)chart.destroy();if(engagement)engagement.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels,datasets:[{label:'Views',data:ordered.map(x=>Number(x.views||0)),tension:.35,fill:false}]},options:{responsive:true,plugins:{legend:{display:false}}}});engagement=new Chart(document.getElementById('engagement'),{type:'doughnut',data:{labels:['Likes','Comments'],datasets:[{data:[likes,comments]}]},options:{responsive:true}})}catch(e){status.textContent='Could not load live analytics data.';console.error(e)}}load();setInterval(load,60000);</script></body></html>
