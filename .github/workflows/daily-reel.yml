name: Hindi Emotional Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: hindi-emotional-reels-repo-writes
  cancel-in-progress: false

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools and handwriting font
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v rsvg-convert >/dev/null 2>&1 && fc-list | grep -qi 'Noto Sans'; then
            echo "System tools/fonts already available; skipping apt install."
          else
            echo "Required system tools/fonts missing. Installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-noto-core fontconfig
          fi
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/Kalam-Light.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/Kalam-Light.ttf
          curl -L --fail --retry 3 -o assets/fonts/Kalam-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/Kalam-Regular.ttf
          sudo mkdir -p /usr/local/share/fonts/dil-ki-diary
          sudo cp assets/fonts/Kalam-Light.ttf assets/fonts/Kalam-Regular.ttf /usr/local/share/fonts/dil-ki-diary/
          sudo fc-cache -f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate poster and music reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAND_HANDLE: ${{ secrets.BRAND_HANDLE }}
        run: python scripts/pipeline.py

      - name: Upload poster and reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-emotional-poster-reel
          path: |
            output/latest_poster.jpg
            output/latest_reel.mp4
            output/latest_metadata.json
          retention-days: 7

      - name: Upload reel to YouTube Shorts when configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/upload.py

      - name: Save content history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_history.json
          git diff --cached --quiet || git commit -m "Update content history"
          git push

      - name: Send Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "📱 Telegram notification: checking configuration..."
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ TELEGRAM_CHAT_ID is missing."
            exit 1
          fi
          echo "✅ Telegram secrets are present."
          echo "📱 Telegram notification: sending..."
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="🎬 Hindi Emotional Reel — SUCCESS%0A%0A✅ Video generated%0A✅ Reel artifact uploaded%0A✅ YouTube upload step completed%0A%0A🔗 GitHub Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            MESSAGE="🚨 Hindi Emotional Reel — FAILED%0A%0A❌ Workflow failed%0A%0A🔗 Check logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}")
          echo "Telegram API response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Telegram notification sent successfully."
          else
            echo "❌ Telegram notification failed, but workflow will continue."
            exit 1
          fi
