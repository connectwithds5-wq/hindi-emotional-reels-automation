name: Hindi Emotional Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools and handwriting font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-noto-core fontconfig
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/Kalam-Light.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/Kalam-Light.ttf
          curl -L --fail --retry 3 -o assets/fonts/Kalam-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/Kalam-Regular.ttf
          sudo mkdir -p /usr/local/share/fonts/dil-ki-diary
          sudo cp assets/fonts/Kalam-Light.ttf assets/fonts/Kalam-Regular.ttf /usr/local/share/fonts/dil-ki-diary/
          sudo fc-cache -f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate poster and music reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAND_HANDLE: ${{ secrets.BRAND_HANDLE }}
        run: python scripts/pipeline.py

      - name: Upload poster and reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-emotional-poster-reel
          path: |
            output/latest_poster.jpg
            output/latest_reel.mp4
            output/latest_metadata.json
          retention-days: 7

      - name: Upload reel to YouTube Shorts when configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/upload.py

      - name: Save content history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_history.json
          git diff --cached --quiet || git commit -m "Update content history"
          git push
